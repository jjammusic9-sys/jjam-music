<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J JAM — Control</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efd8;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:18px}.tabs{display:flex;gap:8px;margin:25px 0}.tab{border:2px solid #111;background:transparent;padding:10px 14px;font-weight:700;cursor:pointer}.tab.active{background:#111;color:#f4efd8}.panel{border-top:2px solid #111;padding-top:25px}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.card{border:2px solid #111;padding:18px;margin:15px 0;background:#f8f3df}.card h3{margin-top:0}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #111;padding:10px;background:#fffdf4}.field textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:2px solid #111;padding:10px 14px;background:#111;color:#f4efd8;font-weight:700;cursor:pointer}.btn.alt{background:transparent;color:#111}.status{padding:12px;border:2px solid #111;margin:15px 0;display:none}.hint{font-size:12px;line-height:1.6;color:#555}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><strong>J JAM / CONTROL</strong><div class="hint">Content control for music and library</div></div><a href="/">View site ↗</a></div><div id="status" class="status"></div><div class="tabs"><button class="tab active" data-tab="releases">Releases</button><button class="tab" data-tab="library">Library</button><button class="tab" data-tab="json">Data</button></div><div id="app"></div></div><script>
const repo='jjammusic9-sys/jjam-music',path='public/content.json';let data=null;const app=document.getElementById('app'),status=document.getElementById('status');
function msg(x){status.textContent=x;status.style.display='block'}function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
async function load(){const r=await fetch('/content.json?'+Date.now());data=await r.json();render('releases')}
function render(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='json'){app.innerHTML='<div class="hint">This is the central content file. For now, use Releases and Library below to edit structured content.</div><pre style="white-space:pre-wrap;border:2px solid #111;padding:15px;overflow:auto">'+esc(JSON.stringify(data,null,2))+'</pre>';return}
const list=data[tab];app.innerHTML='<div class="actions"><button class="btn" onclick="publishToGitHub()">Publish live</button><button class="btn alt" onclick="load()">Reload live data</button><button class="btn alt" onclick="downloadJSON()">Export JSON</button></div><div class="hint" style="margin:12px 0">Publish uses a GitHub fine-grained token only in your browser request. It is not saved by this panel. The token needs repository Contents: Read and write permission for this repository.</div><div class="actions"><button class="btn" onclick="addItem(\''+tab+'\')">+ Add '+(tab==='releases'?'release':'library track')+'</button></div>'+list.map((x,i)=>card(tab,x,i)).join('')}
function card(tab,x,i){const ar=x.ar||{};return '<div class="card"><h3>'+(tab==='releases'?esc(x.title):esc(x.title))+'</h3><div class="row"><div class="field"><label>Title EN</label><input data-i="'+i+'" data-k="title" value="'+esc(x.title)+'"></div><div class="field"><label>Title AR</label><input data-i="'+i+'" data-ar="1" data-k="title" value="'+esc(ar.title)+'"></div><div class="field"><label>Artist EN</label><input data-i="'+i+'" data-k="artist" value="'+esc(x.artist)+'"></div><div class="field"><label>Artist AR</label><input data-i="'+i+'" data-ar="1" data-k="artist" value="'+esc(ar.artist)+'"></div><div class="field"><label>Year</label><input data-i="'+i+'" data-k="year" value="'+esc(x.year)+'"></div><div class="field"><label>Type / category</label><input data-i="'+i+'" data-k="type" value="'+esc(x.type||'')"></div><div class="field"><label>Tags (comma separated)</label><input data-i="'+i+'" data-k="tags" value="'+esc((x.tags||[]).join(', '))"></div><div class="field"><label>File path</label><input data-i="'+i+'" data-k="file" value="'+esc(x.file)+'"></div></div><div class="field"><label>English description</label><textarea data-i="'+i+'" data-k="description">'+esc(x.description)+'</textarea></div><div class="field"><label>Credits EN</label><textarea data-i="'+i+'" data-k="credits">'+esc(ar.description)+'</textarea></div><div class="field"><label>Credits AR</label><textarea data-i="'+i+'" data-ar="1" data-k="credits">(\''+tab+'\','+i+')">Save</button><button class="btn alt" onclick="removeItem(\''+tab+'\','+i+')">Delete</button></div></div>'}
function normalize(obj,k,v){if(k==='year')return Number(v)||new Date().getFullYear();if(k==='tags')return v.split(',').map(x=>x.trim()).filter(Boolean);return v}
function sync(tab,i){document.querySelectorAll('[data-i="'+i+'"]').forEach(el=>{let obj=el.dataset.ar?(data[tab][i].ar||(data[tab][i].ar={})):data[tab][i];obj[el.dataset.k]=normalize(obj,el.dataset.k,el.value)})}
function saveItem(tab,i){sync(tab,i);localStorage.setItem('jjam-draft',JSON.stringify(data));msg('Saved in this browser draft. Use Publish live to update the website.');render(tab)}
function toBase64(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
async function publishToGitHub(){const token=prompt('GitHub fine-grained token (Contents: Read and write). It will not be saved.');if(!token)return;try{msg('Publishing…');const get=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(!get.ok)throw new Error('Could not read content.json ('+get.status+')');const current=await get.json();const body={message:'Update J JAM content from Control Panel',content:toBase64(JSON.stringify(data,null,2)+'\\n'),sha:current.sha,branch:'main'};const put=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!put.ok)throw new Error('GitHub rejected the update ('+put.status+')');localStorage.setItem('jjam-draft',JSON.stringify(data));msg('Published successfully. Cloudflare will deploy the updated content shortly.');}catch(e){msg('Publish failed: '+e.message)}}
function addItem(tab){const x=tab==='releases'?{id:'new-'+Date.now(),file:'',title:'New Release',artist:'',type:'Electronic',year:new Date().getFullYear(),credits:'',description:'',ar:{title:'',artist:'',type:'إلكتروني',credits:'',description:''}}:{id:'new-'+Date.now(),file:'',title:'New Track',artist:'J JAM',year:new Date().getFullYear(),tags:[],credits:'',description:'',license:'Free for non-profit use.',ar:{title:'',artist:'J JAM',tags:[],credits:'',description:'',license:'استخدام مجاني للمشاريع غير الربحية.'}};data[tab].push(x);render(tab)}
function removeItem(tab,i){if(confirm('Delete this item?')){data[tab].splice(i,1);render(tab);localStorage.setItem('jjam-draft',JSON.stringify(data))}}
function downloadJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='content.json';a.click()}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>render(x.dataset.tab));load();
</script></body></html>
