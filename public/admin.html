<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>J JAM — Control</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efd8;color:#111;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #111;padding-bottom:18px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:25px 0}.tab,.btn{border:2px solid #111;background:transparent;padding:10px 14px;font-weight:700;cursor:pointer}.tab.active,.btn{background:#111;color:#f4efd8}.btn.alt{background:transparent;color:#111}.card{border:2px solid #111;padding:18px;margin:15px 0;background:#f8f3df}.row{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin:10px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field textarea{width:100%;border:1px solid #111;padding:10px;background:#fffdf4}.field textarea{min-height:80px}.status{padding:12px;border:2px solid #111;margin:15px 0;display:none}.hint{font-size:12px;line-height:1.6;color:#555}.publish{background:#e8ff3f!important;color:#111!important}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><strong>J JAM / CONTROL</strong><div class="hint">Content control for music and library</div></div><a href="/">View site ↗</a></div><div id="status" class="status"></div><div class="tabs"><button class="tab active" data-tab="releases">Releases</button><button class="tab" data-tab="library">Library</button><button class="tab" data-tab="site">Site</button><button class="tab" data-tab="json">Data</button></div><div id="app"></div></div><script>
const repo='jjammusic9-sys/jjam-music',path='public/content.json';let data=null;
const app=document.getElementById('app'),status=document.getElementById('status');
function msg(x){status.textContent=x;status.style.display='block'}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
async function load(){const r=await fetch('/content.json?'+Date.now());if(!r.ok)throw new Error('Could not load content.json');data=await r.json();render('releases')}
function render(tab){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));if(tab==='site'){renderSite();return}if(tab==='json'){app.innerHTML='<div class="hint">Live structured content.</div><pre style="white-space:pre-wrap;border:2px solid #111;padding:15px;overflow:auto">'+esc(JSON.stringify(data,null,2))+'</pre>';return}const list=data[tab]||[];app.innerHTML='<div class="actions"><button class="btn publish" onclick="publishToGitHub()">Publish live</button><button class="btn alt" onclick="load()">Reload live</button><button class="btn alt" onclick="downloadJSON()">Export JSON</button><button class="btn" onclick="addItem(\''+tab+'\')">+ Add '+(tab==='releases'?'release':'library track')+'</button></div><div class="hint">Publish updates <b>public/content.json</b> in GitHub. The token is requested only for this action and is not saved.</div>'+list.map((x,i)=>card(tab,x,i)).join('')}
function renderSite(){app.innerHTML='<div class="hint">Edit the main website copy in English and Arabic, then save each section as a draft and Publish live.</div>'+['home','about','artists','contact','submit'].map(section=>{const s=data.site[section]||{en:{},ar:{}};return '<div class="card"><h2 style="margin-top:0;text-transform:capitalize">'+section+'</h2><div class="row"><div><h3>English</h3>'+Object.keys(s.en).map(k=>'<div class="field"><label>'+k+'</label>'+taSite(section,'en',k,s.en[k])+'</div>').join('')+'</div><div><h3>العربية</h3>'+Object.keys(s.ar).map(k=>'<div class="field"><label>'+k+'</label>'+taSite(section,'ar',k,s.ar[k])+'</div>').join('')+'</div></div><div class="actions"><button class="btn" onclick="saveSite(\''+section+'\')">Save draft</button></div></div>'}).join('')}
function taSite(section,lang,key,value){return '<textarea data-site-section="'+section+'" data-site-lang="'+lang+'" data-site-key="'+key+'">'+esc(value)+'</textarea>'}
function saveSite(section){document.querySelectorAll('[data-site-section="'+section+'"]').forEach(el=>{data.site[section][el.dataset.siteLang][el.dataset.siteKey]=el.value});localStorage.setItem('jjam-draft',JSON.stringify(data));msg('Site draft saved. Press Publish live when ready.');render('site')}
function inp(i,k,v,ar){return '<input data-i="'+i+'" data-k="'+k+'" '+(ar?'data-ar="1" ':'')+'value="'+esc(v)+'">'}
function ta(i,k,v,ar){return '<textarea data-i="'+i+'" data-k="'+k+'" '+(ar?'data-ar="1" ':'')+'>'+esc(v)+'</textarea>'}
function card(tab,x,i){const a=x.ar||{};return '<div class="card"><h3>'+esc(x.title||'Untitled')+'</h3><div class="row"><div class="field"><label>Title EN</label>'+inp(i,'title',x.title)+'</div><div class="field"><label>Title AR</label>'+inp(i,'title',a.title,1)+'</div><div class="field"><label>Artist EN</label>'+inp(i,'artist',x.artist)+'</div><div class="field"><label>Artist AR</label>'+inp(i,'artist',a.artist,1)+'</div><div class="field"><label>Year</label>'+inp(i,'year',x.year)+'</div><div class="field"><label>Type / category EN</label>'+inp(i,'type',x.type||'')+'</div><div class="field"><label>Type / category AR</label>'+inp(i,'type',a.type||'',1)+'</div><div class="field"><label>Tags EN (comma separated)</label>'+inp(i,'tags',(x.tags||[]).join(', '))+'</div><div class="field"><label>Tags AR (comma separated)</label>'+inp(i,'tags',(a.tags||[]).join(', '),1)+'</div><div class="field"><label>File path</label>'+inp(i,'file',x.file)+'</div></div><div class="field"><label>Description EN</label>'+ta(i,'description',x.description)+'</div><div class="field"><label>Description AR</label>'+ta(i,'description',a.description,1)+'</div><div class="field"><label>Credits EN</label>'+ta(i,'credits',x.credits)+'</div><div class="field"><label>Credits AR</label>'+ta(i,'credits',a.credits,1)+'</div><div class="field"><label>License EN</label>'+ta(i,'license',x.license)+'</div><div class="field"><label>License AR</label>'+ta(i,'license',a.license,1)+'</div><div class="actions"><button class="btn" onclick="saveItem(\''+tab+'\','+i+')">Save draft</button><button class="btn alt" onclick="removeItem(\''+tab+'\','+i+')">Delete</button></div></div>'}
function normalize(k,v){if(k==='year')return Number(v)||new Date().getFullYear();if(k==='tags')return v.split(',').map(x=>x.trim()).filter(Boolean);return v}
function sync(tab,i){document.querySelectorAll('[data-i="'+i+'"]').forEach(el=>{const obj=el.dataset.ar?(data[tab][i].ar||(data[tab][i].ar={})):data[tab][i];obj[el.dataset.k]=normalize(el.dataset.k,el.value)})}
function saveItem(tab,i){sync(tab,i);localStorage.setItem('jjam-draft',JSON.stringify(data));msg('Draft saved in this browser. Press Publish live when ready.');render(tab)}
function addItem(tab){const x=tab==='releases'?{id:'new-'+Date.now(),file:'',title:'New Release',artist:'',type:'Electronic',year:new Date().getFullYear(),credits:'',description:'',ar:{title:'',artist:'',type:'إلكتروني',credits:'',description:''}}:{id:'new-'+Date.now(),file:'',title:'New Track',artist:'J JAM',year:new Date().getFullYear(),tags:[],credits:'',description:'',license:'Free for non-profit use.',ar:{title:'',artist:'J JAM',tags:[],credits:'',description:'',license:'استخدام مجاني للمشاريع غير الربحية.'}};data[tab].push(x);render(tab)}
function removeItem(tab,i){if(confirm('Delete this item?')){data[tab].splice(i,1);localStorage.setItem('jjam-draft',JSON.stringify(data));render(tab)}}
function downloadJSON(){const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='content.json';a.click()}
function toBase64(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin)}
async function publishToGitHub(){const token=prompt('GitHub fine-grained token. It must have Contents: Read and write for this repository. It will not be saved.');if(!token)return;try{msg('Publishing…');const get=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(!get.ok)throw new Error('Could not read content.json ('+get.status+')');const current=await get.json();const body={message:'Update J JAM content from Control Panel',content:toBase64(JSON.stringify(data,null,2)+'\n'),sha:current.sha,branch:'main'};const put=await fetch('https://api.github.com/repos/'+repo+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});if(!put.ok)throw new Error('GitHub rejected the update ('+put.status+')');msg('Published successfully. Cloudflare should deploy the update shortly.');}catch(e){msg('Publish failed: '+e.message)}}
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>render(x.dataset.tab));load().catch(e=>msg(e.message));
</script></body></html>
